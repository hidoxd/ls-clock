name: Build Tweak
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot dpkg-dev perl git curl rsync
      - name: Install ldid
        run: |
          git clone https://github.com/ProcursusTeam/ldid.git
          cd ldid
          git submodule update --init
          ./make.sh
          sudo cp ldid /usr/local/bin/
          sudo chmod +x /usr/local/bin/ldid
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Download SDK
        run: |
          cd $THEOS/sdks
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: LSClock.deb
          path: packages/*.deb
