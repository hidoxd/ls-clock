name: Build Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            fakeroot \
            dpkg-dev \
            perl \
            git \
            curl \
            rsync \
            xz-utils \
            zstd \
            libtinfo6

      - name: Install modern ldid (Procursus)
        run: |
          curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo install -m 755 ldid /usr/local/bin/ldid
          rm ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install modern Clang Toolchain (Kabir Oberai / Theos)
        run: |
          mkdir -p $THEOS/toolchain
          curl -fsSL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz | tar -xJf - -C $THEOS/toolchain/

      - name: Download Patched iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz | tar -xJf - -C $THEOS/sdks/

      - name: Build Rootless Package
        run: |
          make clean package \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LSClock-rootless
          path: packages/*.deb
          if-no-files-found: error
      - name: Build Rootless Package
        run: make clean package
        env:
          THEOS: ${{ github.workspace }}/theos
