name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot dpkg-dev perl git curl rsync xz-utils

      - name: Install ldid
        run: |
          curl -fLO https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo install ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install toolchain
        run: |
          curl -fLO https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar -xvf linux-ios-arm64e-clang-toolchain.tar.lzma -C $TMP
          mkdir -p $THEOS/toolchain/linux/iphone
          mv $TMP/ios-arm64e-clang-toolchain/* $THEOS/toolchain/linux/iphone/
          rm -r linux-ios-arm64e-clang-toolchain.tar.lzma $TMP

      - name: Download SDK
        run: |
          cd $THEOS/sdks
          curl -fLO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz

      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: LSClock.deb
          path: packages/*.deb
