name: Build Tweak
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot dpkg-dev perl git curl rsync
      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo install ldid_linux_x86_64 /usr/local/bin/ldid
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Download SDK
        run: |
          cd $THEOS/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
      - name: Build Package
        run: |
          cd $GITHUB_WORKSPACE
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: LSClock.deb
          path: packages/*.deb
