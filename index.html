<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Прозрачный фон */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 0; /* Убираем лишние отступы между картинками */
        }
        .clock-container {
            display: flex;
            align-items: center;
        }
        img {
            height: 80px; /* Высота часов. Можете поменять! */
            width: auto;
            display: block;
        }
        /* Мигание двоеточия (по желанию, можно убрать) */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #colon {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <img id="h1" src="0.gif">
        <img id="h2" src="0.gif">
        <img id="colon" src="colon.gif">
        <img id="m1" src="0.gif">
        <img id="m2" src="0.gif">
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();

            // Форматируем в 2 цифры (например, 09:05 вместо 9:5)
            let hStr = String(h).padStart(2, '0');
            let mStr = String(m).padStart(2, '0');

            // Обновляем источники картинок
            document.getElementById('h1').src = hStr[0] + '.gif';
            document.getElementById('h2').src = hStr[1] + '.gif';
            document.getElementById('m1').src = mStr[0] + '.gif';
            document.getElementById('m2').src = mStr[1] + '.gif';
        }

        // Запускаем при загрузке
        updateClock();
        // Обновляем каждую секунду
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
